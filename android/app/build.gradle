plugins {
    id "com.android.application"
    // 旧IDの "kotlin-android" ではなく新IDに統一
    id "org.jetbrains.kotlin.android"
    // Flutter 側のプラグイン（settings.gradle の loader とペア）
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.kakeibo"

    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId = "com.example.kakeibo"
        minSdk     = flutter.minSdkVersion
        targetSdk  = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug // デモ用
        }
    }

    // AGP 8.x では Java/Kotlin 17 が推奨
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

flutter {
    source = "../.."
}
