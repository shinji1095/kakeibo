name: kakeibo
description: 35家計簿 ~フトコロ~ (Clean Architecture, Drift persistence)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Routing & DI & State
  go_router: ^14.2.7
  get_it: ^7.7.0
  flutter_riverpod: ^2.5.1

  # UI
  table_calendar: ^3.1.2
  fl_chart: ^0.68.0

  # Persistence (Drift + SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0   # ← drift_db.dart の `package:path/path.dart` 用

  # Misc
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.12
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
